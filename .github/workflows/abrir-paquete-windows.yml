name: Abrir el instalador publicado en Windows
on:
  push:
    branches: [ensayo/verificar-windows]
permissions:
  contents: read
  actions: read
jobs:
  instalar:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Descargar instalador publicado
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 45685941980 --repo $env:GH_REPO -n instalador-windows -D .
          if ($LASTEXITCODE -ne 0) { throw 'Descarga fallida' }
          Get-FileHash .\liquidacion-windows-x64.exe
      - name: Instalar y abrir en el runner
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 's8-app'
          $setup = Start-Process .\liquidacion-windows-x64.exe -ArgumentList '/S',"/D=$target" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "NSIS salió con $($setup.ExitCode)" }
          $file = Get-ChildItem -LiteralPath $target -Filter 'consola-liquidacion.exe' -Recurse |
            Select-Object -First 1
          if (!$file) { Get-ChildItem -LiteralPath $target -Recurse; throw 'Falta el ejecutable instalado' }
          $app = Start-Process -FilePath $file.FullName -PassThru
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep 1
              $app.Refresh()
              if ($app.HasExited) { throw "La app terminó antes de mostrar la ventana" }
              if ($app.MainWindowTitle) { break }
            }
            Write-Host "Ejecutable: $($file.Name); ventana: $($app.MainWindowTitle)"
            if ($app.MainWindowTitle -notlike '*liquidaci*') { throw 'No se pudo reconocer la ventana de la consola' }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
