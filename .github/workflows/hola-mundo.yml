name: Hola mundo
on:
  push:
    branches: [main]
permissions: {}
jobs:
  saludar:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar el saludo de esta revisión
        shell: bash
        run: |
          printf 'Hola mundo\n\nRama: %s\n\nCommit: %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
